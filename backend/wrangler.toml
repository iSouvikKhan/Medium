name = "medium-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
# node-postgres (used by the Prisma driver adapter) needs the Node.js compatibility layer.
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated browser origins allowed to call the API.
CORS_ORIGINS = "http://localhost:5173"

# Secrets are NOT stored here:
#   local:      backend/.dev.vars          (copy .dev.vars.example)
#   production: npx wrangler secret put DATABASE_URL
#               npx wrangler secret put JWT_SECRET
